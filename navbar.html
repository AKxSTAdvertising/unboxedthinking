<style>

/* =====================================================
   AK × ST NAVBAR
===================================================== */

.akst-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 99999;
    padding: 22px 0;
    pointer-events: none;
}

.akst-nav-container {
    width: min(calc(100% - 70px), 1450px);
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    pointer-events: auto;
}


/* =====================================================
   LOGO
===================================================== */

.akst-logo {
    color: #090c12;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 24px;
    font-weight: 800;

    letter-spacing: -1.5px;

    transition: .3s ease;
}

.akst-logo span {
    color: #7c3aed;
}

.akst-logo:hover {
    opacity: .7;
}


/* =====================================================
   DESKTOP NAV
===================================================== */

.akst-desktop-nav {
    display: flex;
    align-items: center;
    gap: 30px;
}

.akst-desktop-nav a {
    position: relative;

    color: #11141b;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;

    transition: color .3s ease;
}


/* underline */

.akst-desktop-nav a:not(.akst-talk)::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: -7px;

    width: 0;
    height: 2px;

    background: #7c3aed;

    transition: width .3s ease;
}

.akst-desktop-nav a:not(.akst-talk):hover::after {
    width: 100%;
}

.akst-desktop-nav a:not(.akst-talk):hover {
    color: #7c3aed;
}


/* =====================================================
   LET'S TALK BUTTON
===================================================== */

.akst-talk {
    padding: 12px 21px;

    border-radius: 100px;

    background: #090c12;

    color: #ffffff !important;

    transition:
        background .3s ease,
        transform .3s ease;
}

.akst-talk:hover {
    background: #7c3aed;
    transform: translateY(-2px);
}


/* =====================================================
   MOBILE BUTTON
===================================================== */

.akst-menu-btn {
    display: none;

    width: 44px;
    height: 44px;

    padding: 0;
    border: 0;

    background: transparent;

    cursor: pointer;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 5px;

    position: relative;
    z-index: 100002;
}

.akst-menu-btn span {
    width: 24px;
    height: 2px;

    display: block;

    background: #090c12;

    transition:
        transform .3s ease,
        opacity .3s ease,
        background .3s ease;
}


/* =====================================================
   MOBILE MENU
===================================================== */

.akst-mobile-menu {
    display: none;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    .akst-navbar {
        padding: 15px 0;
    }

    .akst-nav-container {
        width: calc(100% - 32px);
    }

    /* Hide desktop navigation */
    .akst-desktop-nav {
        display: none;
    }

    /* Show hamburger */
    .akst-menu-btn {
        display: flex;
    }


    /* Full screen mobile menu */

    .akst-mobile-menu {
        display: block;

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100vh;

        background: rgba(8, 11, 18, .96);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        opacity: 0;
        visibility: hidden;

        transform: translateY(-15px);

        transition:
            opacity .3s ease,
            visibility .3s ease,
            transform .3s ease;

        pointer-events: none;
    }


    .akst-mobile-menu.active {
        opacity: 1;
        visibility: visible;

        transform: translateY(0);

        pointer-events: auto;
    }


    .akst-mobile-inner {
        width: calc(100% - 44px);

        margin: auto;

        padding-top: 105px;

        display: flex;
        flex-direction: column;
    }


    .akst-mobile-inner a {
        display: block;

        padding: 16px 0;

        border-bottom: 1px solid rgba(255,255,255,.12);

        color: #ffffff;

        text-decoration: none;

        font-family: Arial, sans-serif;

        font-size: 30px;
        font-weight: 700;

        letter-spacing: -1px;

        transition:
            color .25s ease,
            padding-left .25s ease;
    }


    .akst-mobile-inner a:hover {
        color: #c7ff29;

        padding-left: 8px;
    }


    .akst-mobile-inner .akst-mobile-talk {
        color: #c7ff29;
    }


    /* =================================================
       HAMBURGER → X
    ================================================= */

    .akst-menu-btn.active span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
        background: #ffffff;
    }

    .akst-menu-btn.active span:nth-child(2) {
        opacity: 0;
    }

    .akst-menu-btn.active span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
        background: #ffffff;
    }


    body.akst-menu-open {
        overflow: hidden;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .akst-logo {
        font-size: 21px;
    }

    .akst-mobile-inner a {
        font-size: 26px;
    }

}

</style>


<script>

(function () {

    const menuButton =
        document.getElementById("akstMenuBtn");

    const mobileMenu =
        document.getElementById("akstMobileMenu");


    if (!menuButton || !mobileMenu) {
        return;
    }


    /* OPEN / CLOSE */

    menuButton.addEventListener("click", function () {

        menuButton.classList.toggle("active");

        mobileMenu.classList.toggle("active");

        document.body.classList.toggle(
            "akst-menu-open"
        );

    });


    /* CLOSE AFTER CLICKING LINK */

    mobileMenu
        .querySelectorAll("a")
        .forEach(function (link) {

            link.addEventListener("click", function () {

                menuButton.classList.remove("active");

                mobileMenu.classList.remove("active");

                document.body.classList.remove(
                    "akst-menu-open"
                );

            });

        });

})();

</script>
